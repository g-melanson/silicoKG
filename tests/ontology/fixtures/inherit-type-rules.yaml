version: 1
rules:
  - id: transcript-inherits-gene-type
    when:
      edge:
        class: GeneHasTranscriptProduct
        role: object
    actions:
      - annotate_map:
          target_entity: Transcript
          slot: so_types
          from_slot: type
          from_role: subject
          map:
            ncRNA: SO:0000655
            snRNA: SO:0000274
