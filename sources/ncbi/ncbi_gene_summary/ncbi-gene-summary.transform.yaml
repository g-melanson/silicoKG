id: https://w3id.org/silicokg/transform/ncbi/gene-summary
title: NCBI Gene Summary Transform
prefixes:
  silkg: https://w3id.org/silicokg/

class_derivations:

  Gene:
    populated_from: NCBIGeneSummaryRow
    slot_derivations:
      id:
        expr: "'silkg:Gene:' + str(tax_id) + ':' + str(gene_id)"
      description:
        expr: "summary"
