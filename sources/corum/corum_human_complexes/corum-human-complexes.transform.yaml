id: https://w3id.org/silicokg/transform/corum/human-complexes
title: CORUM Human Complexes Transform
prefixes:
  silkg: https://w3id.org/silicokg/
  CORUM: https://mips.helmholtz-muenchen.de/corum/#

# Every bronze row is run through every class_derivation. Each id expression is
# gated on row_kind so a derivation only mints from its intended row kind; a
# None id causes the transform engine to skip that fragment.

class_derivations:

  ProteinComplex:
    populated_from: CorumComplexRow
    slot_derivations:
      id:
        expr: "('CORUM:' + str(complex_id)) if row_kind == 'complex' else None"
      name:
        expr: "complex_name"
      description:
        expr: "description"
      synonyms:
        expr: "synonyms"
      tax_id:
        expr: "'NCBITaxon:' + str(tax_id)"
      class_labels:
        expr: "class_labels"

  AnnotatedEvidence:
    populated_from: CorumComplexRow
    slot_derivations:
      id:
        expr: >
          ('silkg:AnnotatedEvidence:corum:' + str(complex_id))
          if row_kind == 'complex' else None
      description:
        expr: "evidence_description"
      pubmed_id:
        expr: "pubmed_ids"
      class_labels:
        expr: "class_labels"

  ProteinComplexHasEvidence:
    populated_from: CorumComplexRow
    slot_derivations:
      id:
        expr: >
          ('silkg:ProteinComplexHasEvidence:' + str(complex_id))
          if row_kind == 'complex' else None
      subject:
        expr: "'CORUM:' + str(complex_id)"
      object:
        expr: "'silkg:AnnotatedEvidence:corum:' + str(complex_id)"
      predicate:
        expr: "'silkg:HAS_EVIDENCE'"

  Protein:
    populated_from: CorumSubunitRow
    slot_derivations:
      id:
        expr: "('silkg:Protein:9606:' + str(uniprot_id)) if row_kind == 'subunit' else None"
      symbol:
        expr: "gene_name"
      name:
        expr: "protein_name"
      protein_accession_version:
        expr: "uniprot_id"
      tax_id:
        expr: "'NCBITaxon:' + str(tax_id)"

  ProteinMemberOfComplex:
    populated_from: CorumSubunitRow
    slot_derivations:
      id:
        expr: >
          ('silkg:ProteinMemberOfComplex:9606:' + str(uniprot_id) + ':' + str(complex_id))
          if row_kind == 'subunit' else None
      subject:
        expr: "'silkg:Protein:9606:' + str(uniprot_id)"
      object:
        expr: "'CORUM:' + str(complex_id)"
      predicate:
        expr: "'silkg:MEMBER_OF'"

  ProteinComplexGOAssociation:
    populated_from: CorumFunctionRow
    slot_derivations:
      id:
        expr: >
          ('silkg:ProteinComplexGO:' + str(complex_id) + ':' + str(predicate)
          + ':' + str(go_id)) if row_kind == 'function' else None
      subject:
        expr: "'CORUM:' + str(complex_id)"
      object:
        expr: "go_object_uri"
      predicate:
        expr: "predicate"
      pubmed_id:
        expr: "pubmed_ids"

  GeneGroup:
    populated_from: CorumFcgRow
    slot_derivations:
      id:
        expr: "('CORUM:FCG' + str(fcg_id)) if row_kind == 'fcg' else None"
      name:
        expr: "fcg_name"
      class_labels:
        expr: "class_labels"

  ProteinComplexMemberOfGeneGroup:
    populated_from: CorumFcgRow
    slot_derivations:
      id:
        expr: >
          ('silkg:ProteinComplexMemberOfFCG:' + str(complex_id) + ':' + str(fcg_id))
          if row_kind == 'fcg' else None
      subject:
        expr: "'CORUM:' + str(complex_id)"
      object:
        expr: "'CORUM:FCG' + str(fcg_id)"
      predicate:
        expr: "'silkg:MEMBER_OF'"
      pubmed_id:
        expr: "pubmed_ids"

  GeneGroupBroadMatchGO:
    populated_from: CorumFcgRow
    slot_derivations:
      id:
        expr: >
          ('silkg:GeneGroupBroadMatchGO:FCG' + str(fcg_id) + ':' + str(go_id))
          if (row_kind == 'fcg' and go_object_uri) else None
      subject:
        expr: "'CORUM:FCG' + str(fcg_id)"
      object:
        expr: "go_object_uri"
      predicate:
        expr: "'silkg:BROAD_MATCH'"
