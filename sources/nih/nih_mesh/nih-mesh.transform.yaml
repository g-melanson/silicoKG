id: https://w3id.org/silicokg/transform/nih/mesh
title: NIH MeSH Transform
prefixes:
  silkg: https://w3id.org/silicokg/
  mesh: https://id.nlm.nih.gov/mesh/

# Domain classes (MeSHDescriptor, MeSHBroaderThan) are defined in schemas/domain/.
# Wire derivations here once the domain schema section lands.

class_derivations:

  MeSHDescriptor:
    populated_from: NIHMeshDescriptorRow
    slot_derivations:
      id:
        expr: "'silkg:MeSHDescriptor:mesh:' + str(descriptor_ui)"
      name:
        expr: "label"
      description:
        expr: "scope_note"
      synonyms:
        expr: "synonyms"

  MeSHBroaderThan:
    populated_from: NIHMeshEdgeRow
    slot_derivations:
      id:
        expr: >
          'silkg:MeSHBroaderThan:' + str(subject_id) + ':' + str(object_id) + ':' + str(tree_number)
      subject:
        expr: "'silkg:MeSHDescriptor:mesh:' + str(subject_id)"
      object:
        expr: "'silkg:MeSHDescriptor:mesh:' + str(object_id)"
      predicate:
        expr: "'silkg:SUBCLASS_OF'"
